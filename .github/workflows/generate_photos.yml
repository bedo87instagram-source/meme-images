name: Generate fashion photos

on:
  workflow_dispatch:
    inputs:
      jobs_file:
        description: "Path to a JSON jobs file in this repo (e.g. jobs/test.json)"
        type: string
        required: true

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install requests pillow
      - name: Generate images
        id: gen
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          set +e
          python tools/generate_photos.py ${{ inputs.jobs_file }} > generate.log 2>&1
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          cat generate.log
      - name: Commit generated images and log
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/generated generate.log
          if ! git diff --cached --quiet; then
            git commit -m "Generate fashion photos (${{ inputs.jobs_file }}) [exit ${{ steps.gen.outputs.exit_code }}]"
            git pull --rebase --autostash
            git push
          else
            echo "nothing new to commit"
          fi
      - name: Fail if generation failed
        if: steps.gen.outputs.exit_code != '0'
        run: exit 1
