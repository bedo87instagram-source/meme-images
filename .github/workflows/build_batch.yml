name: Build content batch

# Builds a whole batch (photos, Reels, tip cards) from specs/<id>.json, validates it,
# and publishes batches/<id>.json. meme-poster imports it automatically, append-only.
on:
  workflow_dispatch:
    inputs:
      spec:
        description: "Spec file, e.g. specs/b02.json"
        type: string
        required: true

permissions:
  contents: write

concurrency:
  group: build-batch
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install requests pillow
          which ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
      - name: Build batch
        id: build
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          set +e
          python tools/build_batch.py "${{ inputs.spec }}" > build.log 2>&1
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          cat build.log
      # Commit whatever was produced even on failure, so a re-run resumes instead of
      # regenerating photos. The batch file itself is only written when everything passed.
      - name: Commit outputs and log
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build.log
          for d in images batches; do [ -d "$d" ] && git add "$d"; done
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "Build ${{ inputs.spec }} [exit ${{ steps.build.outputs.exit_code }}]"
          for attempt in 1 2 3 4 5; do
            if git pull --rebase --autostash && git push; then exit 0; fi
            sleep $((attempt * 5))
          done
          echo "::error::could not push build outputs"; exit 1
      - name: Fail if build failed
        if: steps.build.outputs.exit_code != '0'
        run: exit 1
